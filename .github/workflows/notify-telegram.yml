name: Reusable Notify

# v2 — PR·배포 알림을 전 레포 공통 서식(HTML)으로 보낸다. 서식과 호출 계약은 docs/workflows/notify-telegram.md
on:
  workflow_call:
    inputs:
      event_kind:
        description: "pr | deploy"
        required: true
        type: string
      project:
        description: "프로젝트/서비스명"
        required: false
        type: string
      environment:
        description: "dev | stg | prod 등 (deploy)"
        required: false
        type: string
      result:
        description: "success | failure 만 보낸다. cancelled·skipped 는 보내지 않는다 (deploy)"
        required: false
        type: string
      message:
        description: "배포 메모 (deploy)"
        required: false
        type: string
      tag:
        description: "배포한 태그 (deploy)"
        required: false
        type: string
      url:
        description: "배포된 서비스 주소 (deploy)"
        required: false
        type: string
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_TO_PR:
        required: false
      TELEGRAM_TO_DEPLOY:
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # 신뢰할 수 없는 값(PR 제목·커밋 메시지·입력값)은 ${{ }} 로 스크립트에 인라인하지 않고 env·이벤트 파일로만 읽는다
      - name: Build message
        id: msg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_KIND: ${{ inputs.event_kind }}
          IN_PROJECT: ${{ inputs.project }}
          IN_ENV: ${{ inputs.environment }}
          IN_RESULT: ${{ inputs.result }}
          IN_MESSAGE: ${{ inputs.message }}
          IN_TAG: ${{ inputs.tag }}
          IN_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          EV="$GITHUB_EVENT_PATH"
          REPO="$GITHUB_REPOSITORY"
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"

          esc() { printf '%s' "${1-}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'; }
          ev() { jq -r "$1 // empty" "$EV"; }
          skip() { echo "::notice::$1 — 알림을 보내지 않는다"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # gh api 는 HTTP 오류에도 응답 본문을 stdout 에 낸다 — 성공했을 때만 본문을 돌려준다
          api() { local out; if out="$(gh api "$@" 2>/dev/null)"; then printf '%s' "$out"; fi; }

          # 한 줄에 「항목: 값」 하나 — 입력값은 첫 줄만 쓴다
          for v in IN_PROJECT IN_ENV IN_MESSAGE IN_TAG IN_URL; do printf -v "$v" '%s' "${!v%%$'\n'*}"; done

          # 머리말 바로 아래가 핵심 묶음, 그 뒤는 굵은 소제목으로 묶는다. 빈 묶음은 소제목째 뺀다
          BODY=""; SECTION=""; CUR=()
          flush() {
            if (( ${#CUR[@]} )); then
              if [[ -n "$SECTION" ]]; then BODY+=$'\n\n'"<b>$SECTION</b>"; fi
              for l in "${CUR[@]}"; do BODY+=$'\n'"$l"; done
            fi
            CUR=()
          }
          section() { flush; SECTION="$1"; }
          add() { if [[ -n "${2-}" ]]; then CUR+=("$1: $2"); fi; }

          case "$EVENT_KIND" in
            pr)
              case "$GITHUB_EVENT_NAME" in
                pull_request|pull_request_target) ;;
                *) echo "::error::event_kind=pr 은 pull_request 이벤트에서만 호출한다 (현재: $GITHUB_EVENT_NAME)"; exit 1 ;;
              esac
              ACTION="$(ev '.action')"
              case "$ACTION" in
                opened)           TITLE="PR 열림" ;;
                reopened)         TITLE="PR 재오픈" ;;
                ready_for_review) TITLE="PR 리뷰 준비 완료" ;;
                *) skip "PR action=$ACTION 은 알림 대상이 아니다" ;;
              esac
              if [[ "$(ev '.pull_request.draft')" == "true" ]]; then skip "Draft PR"; fi
              # pull_request 이벤트는 Dependabot·fork PR 에 Secret 을 넘기지 않는다
              if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                if [[ "$GITHUB_ACTOR" == "dependabot[bot]" ]]; then skip "Dependabot PR"; fi
                HEAD_REPO="$(ev '.pull_request.head.repo.full_name')"
                if [[ -n "$HEAD_REPO" && "$HEAD_REPO" != "$REPO" ]]; then skip "fork PR ($HEAD_REPO)"; fi
              fi

              # 본문 「## 👀 리뷰」 절의 첫 값 줄(안내 인용·HTML 주석·빈 줄 제외). 절이 있는데 값이 필요·불필요가 아니면 미기재
              # awk 는 입력을 끝까지 읽는다 — 중간에 exit 하면 앞 단계가 SIGPIPE 로 죽고 pipefail 이 step 을 실패시킨다
              REVIEW="$(jq -r '.pull_request.body // ""' "$EV" | tr -d '\r' | awk '
                d { next }
                /^##[[:space:]]/ { if (f) d = 1; else if ($0 ~ /^##[[:space:]]*👀[[:space:]]*리뷰[[:space:]]*$/) f = 1; next }
                f && /^[[:space:]]*(>.*|<!--.*)?$/ { next }
                f { v = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); d = 1 }
                END { if (f) print (v == "" ? "?" : v) }')"
              case "$REVIEW" in
                ""|필요|불필요) ;;
                *) REVIEW="미기재" ;;
              esac

              HEADER="🧩 $TITLE"
              add "레포" "$(esc "${REPO#*/}")"
              add "프로젝트" "$(esc "$IN_PROJECT")"
              add "제목" "$(esc "#$(ev '.pull_request.number') $(ev '.pull_request.title')")"
              add "리뷰" "$REVIEW"
              add "작성자" "$(esc "$(ev '.pull_request.user.login')")"
              add "브랜치" "$(esc "$(ev '.pull_request.head.ref') → $(ev '.pull_request.base.ref')")"
              # 링크는 <a> 로 감싸지 않고 URL 그대로 둔다 — 글자와 주소가 다른 링크는 텔레그램이 열기 확인창을 띄운다
              add "링크" "$(esc "$(ev '.pull_request.html_url')")"
              section "상세"
              add "리뷰어" "$(esc "$(jq -r '[(.pull_request.requested_reviewers // [])[].login, (.pull_request.requested_teams // [])[].name] | join(", ")' "$EV")")"
              add "변경" "커밋 $(ev '.pull_request.commits') · 파일 $(ev '.pull_request.changed_files') · +$(ev '.pull_request.additions') −$(ev '.pull_request.deletions')"
              add "라벨" "$(esc "$(jq -r '[(.pull_request.labels // [])[].name] | join(", ")' "$EV")")"
              ;;

            deploy)
              case "$IN_RESULT" in
                success) HEADER="✅ 배포 성공" ;;
                failure) HEADER="❌ 배포 실패" ;;
                cancelled|skipped) skip "배포 result=$IN_RESULT" ;;
                *) echo "::error::result 는 success | failure | cancelled | skipped 중 하나여야 한다 (현재: '${IN_RESULT}')"; exit 1 ;;
              esac

              SHA="$GITHUB_SHA"
              if [[ "$(ev '.pull_request.merged')" == "true" ]]; then SHA="$(ev '.pull_request.merge_commit_sha')"; fi
              SUBJECT="$(ev '.head_commit.message')"
              if [[ -z "$SUBJECT" ]]; then
                SUBJECT="$(api "repos/$REPO/commits/$SHA" --jq '.commit.message')"
              fi
              SUBJECT="${SUBJECT%%$'\n'*}"
              COUNT="$(jq -r '(.commits // []) | length' "$EV")"
              MORE=""
              # push 페이로드의 commits 는 20건까지만 담긴다
              if (( COUNT >= 20 )); then MORE=" 외 $((COUNT - 1))건 이상"
              elif (( COUNT > 1 )); then MORE=" 외 $((COUNT - 1))건"; fi

              # 실행 시각·실패 단계는 Actions API 로 읽는다 — 호출 job 에 actions: read 가 없으면 두 줄만 빠진다
              RUN_JSON="$(api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
              JOBS_JSON="$(api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")"
              if [[ -z "$RUN_JSON" || -z "$JOBS_JSON" ]]; then
                echo "::warning::Actions API 를 읽지 못해 소요 시간·실패 단계를 뺀다 — 호출 job 에 permissions: actions: read 를 준다"
              fi

              DURATION=""
              STARTED=""
              if [[ -n "$RUN_JSON" ]]; then STARTED="$(jq -r '.run_started_at // empty' <<< "$RUN_JSON")"; fi
              if [[ -n "$STARTED" ]]; then
                SEC=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
                if   (( SEC >= 3600 )); then DURATION="$((SEC / 3600))시간 $((SEC % 3600 / 60))분"
                elif (( SEC >= 60 ));   then DURATION="$((SEC / 60))분 $((SEC % 60))초"
                else                         DURATION="${SEC}초"
                fi
              fi

              FAILED_STEP=""
              if [[ "$IN_RESULT" == "failure" && -n "$JOBS_JSON" ]]; then
                FAILED_STEP="$(jq -r '
                  [(.jobs // [])[] | select(.conclusion == "failure")][0] // empty
                  | .name + ([(.steps // [])[] | select(.conclusion == "failure")][0] | if . then " › " + .name else "" end)
                ' <<< "$JOBS_JSON")"
              fi

              NOTE=()
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then NOTE+=("수동 실행"); fi
              if (( GITHUB_RUN_ATTEMPT > 1 )); then NOTE+=("재실행 ${GITHUB_RUN_ATTEMPT}회차"); fi
              BY="${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR}"
              if (( ${#NOTE[@]} )); then
                J="${NOTE[0]}"; for n in "${NOTE[@]:1}"; do J+=" · $n"; done
                BY="$BY ($J)"
              fi

              add "레포" "$(esc "${REPO#*/}")"
              add "프로젝트" "$(esc "$IN_PROJECT")"
              add "환경" "$(esc "$IN_ENV")"
              BRANCH="$(ev '.pull_request.base.ref')"
              add "브랜치" "$(esc "${BRANCH:-$GITHUB_REF_NAME}")"
              add "실패 단계" "$(esc "$FAILED_STEP")"
              section "변경 내용"
              add "커밋" "${SHA:0:7}${SUBJECT:+ $(esc "$SUBJECT")}$MORE"
              add "메시지" "$(esc "$IN_MESSAGE")"
              add "태그" "$(esc "$IN_TAG")"
              section "실행 정보"
              add "실행자" "$(esc "$BY")"
              add "소요 시간" "$DURATION"
              add "실행 로그" "$(esc "$SERVER/$REPO/actions/runs/$GITHUB_RUN_ID")"
              add "서비스" "$(esc "$IN_URL")"
              ;;

            *)
              echo "::error::event_kind 는 pr | deploy 중 하나여야 한다 (현재: '${EVENT_KIND}')"
              exit 1
              ;;
          esac

          flush
          TEXT="<b>$(esc "$HEADER")</b>$BODY"

          DELIM="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "text<<$DELIM"
            printf '%s\n' "$TEXT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram
        if: steps.msg.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_KIND: ${{ inputs.event_kind }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TO_PR: ${{ secrets.TELEGRAM_TO_PR }}
          TO_DEPLOY: ${{ secrets.TELEGRAM_TO_DEPLOY }}
          TEXT: ${{ steps.msg.outputs.text }}
        run: |
          set -euo pipefail

          case "$EVENT_KIND" in
            pr)     CHAT_ID="$TO_PR";     HINT="레포 Secret TELEGRAM_TO_PR 에 이 레포의 PR 방 id 를 등록한다" ;;
            deploy) CHAT_ID="$TO_DEPLOY"; HINT="조직 Secret TELEGRAM_TO_DEPLOY 의 Repository access 에 이 레포를 추가한다" ;;
          esac
          # 방을 못 찾으면 다른 방으로 대신 보내지 않고 실패시킨다 — PR 방은 레포마다 다르다
          if [[ -z "$BOT_TOKEN" ]]; then echo "::error::Secret TELEGRAM_TOKEN 이 비어 있다 — 조직 Secret 의 Repository access 에 이 레포를 추가한다"; exit 1; fi
          if [[ -z "$CHAT_ID" ]];   then echo "::error::채팅방 Secret 이 비어 있다 — $HINT"; exit 1; fi

          if ! RESP="$(curl -sS --fail-with-body --retry 3 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode 'link_preview_options={"is_disabled":true}' \
                --data-urlencode "text=${TEXT}")"; then
            echo "::error::텔레그램 전송 실패: $RESP"
            exit 1
          fi
          echo "전송 완료 (message_id=$(jq -r '.result.message_id' <<< "$RESP"))"
